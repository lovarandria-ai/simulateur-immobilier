<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Simulateurs d'investissement immobilier</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0C1116" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Simu Immo" />
<meta name="application-name" content="Simu Immo" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#0C1116;--sans:"Aptos Narrow","Aptos","Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:#0C1116;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .topnav{flex:0 0 auto;background:#0C1116;color:#fff;display:flex;align-items:center;gap:16px;padding:9px 20px;border-bottom:1px solid #000}
  .topnav .logo{display:flex;flex-direction:column;gap:1px;margin-right:auto}
  .topnav .logo .kick{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#6E8091}
  .topnav .logo .ttl{font-size:14px;font-weight:600;color:#fff}
  .tabs{display:flex;background:#161E27;border:1px solid #26313D;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
  .tabs button{font-family:var(--sans);font-size:12.5px;font-weight:500;color:#9FB0BE;background:none;border:0;padding:8px 13px;border-radius:7px;cursor:pointer;transition:.15s;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tabs button:hover{color:#fff}
  .tabs button.on[data-app="res"]{background:#8A6D3B;color:#fff}
  .tabs button.on[data-app="lcd"]{background:#0E7C66;color:#fff}
  .tabs button.on[data-app="com"]{background:#2C5F8A;color:#fff}
  .tabs button.on[data-app="loca"]{background:#6E4D8E;color:#fff}
  .tabs button.on[data-app="den"]{background:#155E56;color:#fff}
  .tabs button.on[data-app="mdb"]{background:#B5513B;color:#fff}
  .tabs button .dot{width:7px;height:7px;border-radius:50%}
  .tabs button[data-app="res"] .dot{background:#8A6D3B}
  .tabs button[data-app="lcd"] .dot{background:#0E7C66}
  .tabs button[data-app="com"] .dot{background:#2C5F8A}
  .tabs button[data-app="loca"] .dot{background:#6E4D8E}
  .tabs button[data-app="den"] .dot{background:#155E56}
  .tabs button[data-app="mdb"] .dot{background:#B5513B}
  .tabs button.on .dot{background:#fff}
  .stage{flex:1 1 auto;position:relative;background:#E9EDF1}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#E9EDF1}
  iframe.hidden{visibility:hidden;pointer-events:none}
  @media(max-width:860px){.topnav .logo{display:none}.topnav{justify-content:center}}
</style>
</head>
<body>
  <div class="topnav">
    <div class="logo"><span class="kick">Investissement immobilier</span><span class="ttl">Suite de simulateurs</span></div>
    <div class="tabs" id="tabs">
      <button data-app="res" class="on"><span class="dot"></span>Location longue durée</button>
      <button data-app="loca"><span class="dot"></span>Loc'Avantages</button>
      <button data-app="den"><span class="dot"></span>Denormandie</button>
      <button data-app="lcd"><span class="dot"></span>Location courte durée</button>
      <button data-app="com"><span class="dot"></span>Immobilier commercial</button>
      <button data-app="mdb"><span class="dot"></span>Marchand de biens</button>
    </div>
  </div>
  <div class="stage">
    <iframe id="f-res" title="Location longue durée"></iframe>
    <iframe id="f-loca" title="Loc'Avantages" class="hidden"></iframe>
    <iframe id="f-den" title="Denormandie" class="hidden"></iframe>
    <iframe id="f-lcd" title="Location courte durée" class="hidden"></iframe>
    <iframe id="f-com" title="Immobilier commercial" class="hidden"></iframe>
    <iframe id="f-mdb" title="Marchand de biens" class="hidden"></iframe>
  </div>
